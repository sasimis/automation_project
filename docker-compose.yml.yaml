version: "3.9"
services:
  automation_app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # If you need Google credentials at runtime, mount or pass them here:
      # Example: use service account JSON inside the container
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
      # Optional Streamlit tweaks:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # live-reload code (hot reload is fine for Streamlit)
      - .:/app:delegated
      # If you don’t want live bind-mounts in prod, remove the line above.
    restart: unless-stopped
