version: '3.8'
services:
  main-app:
    image: my-automation-app  # Use pre-built image
    command: python -m streamlit run app/main2.py --server.port=8501 --server.address=0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]

  html-viewer:
    image: my-automation-app  # Reuse same image
    command: python -m streamlit run app/html_viewer.py --server.port=8501 --server.address=0.0.0.0
    ports: ["8502:8501"]
    volumes: ["./data:/app/data"]